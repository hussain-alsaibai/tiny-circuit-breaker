[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-circuit-breaker"
version = "0.1.0"
description = "Zero-dependency circuit breaker for LLM API calls — thread-safe CLOSED → OPEN → HALF_OPEN state machine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["circuit-breaker", "resilience", "fault-tolerance", "llm", "ai-agents", "stdlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["tiny_circuit_breaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
