[project]
name = "tiny-circuit-breaker"
version = "1.0.0"
description = "Zero-dependency Circuit Breaker. Three-state FSM: CLOSED→OPEN→HALF-OPEN. Thread-safe."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
]
keywords = ["circuit-breaker", "resilience", "fault-tolerance", "zero-dependency", "stdlib"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-circuit-breaker"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tiny_circuit_breaker"]
